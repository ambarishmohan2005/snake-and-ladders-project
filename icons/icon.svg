<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ladderGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Board Grid Hint -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <line x1="80" y1="150" x2="432" y2="150" />
    <line x1="80" y1="230" x2="432" y2="230" />
    <line x1="80" y1="310" x2="432" y2="310" />
    <line x1="80" y1="390" x2="432" y2="390" />
    <line x1="150" y1="80" x2="150" y2="432" />
    <line x1="230" y1="80" x2="230" y2="432" />
    <line x1="310" y1="80" x2="310" y2="432" />
    <line x1="390" y1="80" x2="390" y2="432" />
  </g>

  <!-- Golden Ladder (Bottom Left to Upper Right) -->
  <g filter="url(#shadow)">
    <!-- Rails -->
    <line x1="130" y1="410" x2="280" y2="130" stroke="url(#ladderGrad)" stroke-width="14" stroke-linecap="round" />
    <line x1="175" y1="435" x2="325" y2="155" stroke="url(#ladderGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Rungs -->
    <line x1="140" y1="390" x2="185" y2="415" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <line x1="165" y1="345" x2="210" y2="370" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <line x1="190" y1="300" x2="235" y2="325" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <line x1="215" y1="255" x2="260" y2="280" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <line x1="240" y1="210" x2="285" y2="235" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <line x1="265" y1="165" x2="310" y2="190" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- S-Curved Green Snake -->
  <g filter="url(#shadow)">
    <!-- Snake Body -->
    <path d="M 400 130 C 330 140, 310 220, 360 270 C 410 320, 370 410, 290 420"
          fill="none" stroke="url(#snakeGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Snake Highlights -->
    <path d="M 395 135 C 335 145, 315 220, 360 270 C 405 320, 365 405, 295 418"
          fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 18" />
    <!-- Snake Head -->
    <circle cx="400" cy="130" r="24" fill="#059669" />
    <!-- Snake Eye -->
    <circle cx="410" cy="122" r="6" fill="#ffffff" />
    <circle cx="412" cy="122" r="3" fill="#0f172a" />
    <!-- Snake Tongue -->
    <path d="M 422 130 Q 436 128 444 124 M 436 128 Q 444 134 446 136" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- 3D Red Dice -->
  <g transform="translate(280, 270) rotate(-12)" filter="url(#shadow)">
    <rect x="0" y="0" width="130" height="130" rx="28" fill="#ef4444" stroke="#dc2626" stroke-width="5" />
    <rect x="6" y="6" width="118" height="118" rx="22" fill="none" stroke="#fca5a5" stroke-width="2" opacity="0.6" />
    <!-- 5-Pip Pattern (White) -->
    <circle cx="32" cy="32" r="11" fill="#ffffff" />
    <circle cx="98" cy="32" r="11" fill="#ffffff" />
    <circle cx="65" cy="65" r="11" fill="#ffffff" />
    <circle cx="32" cy="98" r="11" fill="#ffffff" />
    <circle cx="98" cy="98" r="11" fill="#ffffff" />
  </g>

  <!-- Gold Star Accents -->
  <path d="M 120 100 L 126 116 L 142 122 L 126 128 L 120 144 L 114 128 L 98 122 L 114 116 Z" fill="#fbbf24" />
  <path d="M 430 380 L 434 392 L 446 396 L 434 400 L 430 412 L 426 400 L 414 396 L 426 392 Z" fill="#fbbf24" />
</svg>